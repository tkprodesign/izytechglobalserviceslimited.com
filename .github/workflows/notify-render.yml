name: Render Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/notify-render.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-backend-main
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: srv-d9hd617avr4c73ebtj9g
      HEALTH_URL: https://izytech-api.onrender.com/api/health
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Validate deployment credentials
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "RENDER_API_KEY is not configured."
            exit 1
          fi

      - name: Find or trigger deploy for this commit
        id: render
        run: |
          set -euo pipefail
          sleep 20

          LIST=$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $RENDER_API_KEY"             -H "Accept: application/json"             "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1")

          LATEST_ID=$(printf '%s' "$LIST" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['deploy']['id'] if d else '')")
          LATEST_COMMIT=$(printf '%s' "$LIST" | python3 -c "import json,sys; d=json.load(sys.stdin); print(((d[0]['deploy'].get('commit') or {}).get('id')) if d else '')")

          if [ -n "$LATEST_ID" ] && [ "$LATEST_COMMIT" = "$COMMIT_SHA" ]; then
            DEPLOY_ID="$LATEST_ID"
            echo "Render already has a deploy for this commit."
          else
            PAYLOAD=$(python3 -c "import json,os; print(json.dumps({'commitId': os.environ['COMMIT_SHA'], 'clearCache': 'do_not_clear'}))")
            CREATED=$(curl --fail-with-body --silent --show-error               -X POST               -H "Authorization: Bearer $RENDER_API_KEY"               -H "Accept: application/json"               -H "Content-Type: application/json"               --data "$PAYLOAD"               "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")
            DEPLOY_ID=$(printf '%s' "$CREATED" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
            echo "Triggered Render deploy for the current commit."
          fi

          if [ -z "$DEPLOY_ID" ]; then
            echo "Could not determine the Render deploy ID."
            exit 1
          fi
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Render and verify health
        run: |
          set -euo pipefail
          DEPLOY_ID="${{ steps.render.outputs.deploy_id }}"

          for attempt in $(seq 1 80); do
            RESPONSE=$(curl --fail-with-body --silent --show-error               -H "Authorization: Bearer $RENDER_API_KEY"               -H "Accept: application/json"               "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID")

            STATUS=$(printf '%s' "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
            echo "Render status: $STATUS"

            case "$STATUS" in
              live)
                break
                ;;
              build_failed|update_failed|pre_deploy_failed|deactivated|canceled)
                echo "Render deployment failed with status: $STATUS"
                exit 1
                ;;
            esac

            if [ "$attempt" -eq 80 ]; then
              echo "Timed out waiting for Render deployment."
              exit 1
            fi
            sleep 15
          done

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$HEALTH_URL" > /tmp/izy-health.json; then
              python3 - <<'PY'
import json
with open('/tmp/izy-health.json', encoding='utf-8') as handle:
    data = json.load(handle)
if data.get('status') != 'ok':
    raise SystemExit('Health endpoint did not return status=ok')
print('Render API health check: ok')
PY
              exit 0
            fi
            sleep 10
          done

          echo "Render deployed but the health endpoint did not recover in time."
          exit 1

      - name: Notify success
        if: success()
        continue-on-error: true
        run: |
          curl --silent --output /dev/null             -H "Title: Render backend live"             -H "Priority: default"             -H "Tags: white_check_mark,satellite"             -H "Click: $HEALTH_URL"             -d "Commit ${COMMIT_SHA:0:7} is live and the API health check passed."             https://ntfy.sh/TKProRocketGuild

      - name: Notify failure
        if: failure()
        continue-on-error: true
        run: |
          curl --silent --output /dev/null             -H "Title: Render deploy failed"             -H "Priority: high"             -H "Tags: x,warning"             -H "Click: https://dashboard.render.com/web/$RENDER_SERVICE_ID/deploys"             -d "Backend deployment verification failed for commit ${COMMIT_SHA:0:7}."             https://ntfy.sh/TKProRocketGuild
