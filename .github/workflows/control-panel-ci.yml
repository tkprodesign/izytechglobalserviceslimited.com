name: Control Panel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require changelog for repository changes
        shell: bash
        run: |
          changed_files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          behavior_change="false"

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md) ;;
              *) behavior_change="true" ;;
            esac
          done <<< "$changed_files"

          if [ "$behavior_change" = "true" ]; then
            changelog_changed="false"
            while IFS= read -r file; do
              if [ "$file" = "CHANGELOG.md" ]; then
                changelog_changed="true"
                break
              fi
            done <<< "$changed_files"

            if [ "$changelog_changed" != "true" ]; then
              echo "ERROR: This commit changes non-Markdown repository files but does not update CHANGELOG.md."
              echo "Read AGENTS.md and add a changelog entry in the same commit."
              echo "Changed files:"
              printf '%s\n' "$changed_files"
              exit 1
            fi
          fi

      - name: Build Cloudflare frontend
        run: npm run pages:build

      - name: Check backend syntax
        run: node --check server/expressApp.js

      - name: AltPower tests
        run: npm run test:altpower

      - name: Contact follow-up tests
        run: npm run test:contact-followup

      - name: Invoice tests
        run: npm run test:invoices

      - name: Auth security tests
        run: node --test server/tests/authSecurity.test.js
